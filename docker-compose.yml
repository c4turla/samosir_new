# ============================================================
# SAMOSIR - Docker Compose
# Services: app (PHP+Nginx), db (MySQL), redis (cache)
# ============================================================

services:
  # ── Application (PHP-FPM + Nginx) ────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samosir-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
      - "${REVERB_PORT:-8080}:8080"
    environment:
      - APP_NAME=${APP_NAME:-SAMOSIR}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-samosir_db}
      - DB_USERNAME=${DB_USERNAME:-samosir}
      - DB_PASSWORD=${DB_PASSWORD:-samosir_secret}
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - BROADCAST_CONNECTION=reverb
      - FILESYSTEM_DISK=local
      - REVERB_APP_ID=${REVERB_APP_ID:-843532}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-samosirkey123}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-samosirsecret456}
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REVERB_SCHEME=${REVERB_SCHEME:-http}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost:8000}
      - SESSION_DOMAIN=${SESSION_DOMAIN:-localhost}
      - VITE_APP_NAME=${APP_NAME:-SAMOSIR}
      - VITE_REVERB_APP_KEY=${REVERB_APP_KEY:-samosirkey123}
      - VITE_REVERB_HOST=${REVERB_HOST:-localhost}
      - VITE_REVERB_PORT=${REVERB_PORT:-8080}
      - VITE_REVERB_SCHEME=${REVERB_SCHEME:-http}
      - TELESCOPE_ENABLED=false
    volumes:
      - app-storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - samosir-net

  # ── Database (MySQL 8) ───────────────────────────────────
  db:
    image: mysql:8.0
    container_name: samosir-db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-samosir_db}
      MYSQL_USER: ${DB_USERNAME:-samosir}
      MYSQL_PASSWORD: ${DB_PASSWORD:-samosir_secret}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/samosir.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - samosir-net

volumes:
  db-data:
    driver: local
  app-storage:
    driver: local

networks:
  samosir-net:
    driver: bridge
